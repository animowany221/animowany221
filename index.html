<!DOCTYPE html>

<html lang="pl" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="google-site-verification" content="C7WuWoOkG5ht6q7HCufEz8qlYlowXTez_aCwUc7leZI" />
    <title>strona główna</title>
    <style>
        body {
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQNs9qMjnfzJCs1xita_EYJDDNSvw5BWqhh8VCfpNCHAvpMGy7Cf_V-8xY&s=10');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #ffffff;
        }
        img {
            max-width: 100%;
            height: auto;
            margin-top: 20px;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        marquee {
            margin-top: 20px;
            font-size: 30px;
            color: #eaff00;
        }
    </style>
</head>
<body>
    <h1>Witaj</h1>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTQIzNHikhBeJJNg0q5dAKVJyY2MXW2ybka3E4K0-3PdQ&s=10" alt="Funny cat" />
    <button onclick="changeText()">Zmień tekst</button>
    <marquee behavior="scroll" direction="left" scrollamount="20">
        <p>Dziękuję za odwiedzenie strony!</p>
    </marquee>
    <script>
        function changeText() {
            if (typeof zmienionyTekst !== 'undefined' && zmienionyTekst === 1) {
                alert("Tekst został już zmieniony.");
                return;
            }
            if (confirm("Czy chcesz zmienić tekst?")) {
                document.querySelector("h1").textContent = "lubię placki";
                document.querySelector("img").src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0Q7ELp5PSo09M1-wJh3cU-x4U7hHsoA5IANQruCWOhA&s=10";
                document.querySelector("img").alt = "pancake";
                const zmienionyTekst = 1;
            }
        }
    </script>
    strona działa dzięki platformie github i funkcji pages
    <button onclick="window.location.href='/informacje/'">Informacje</button>
</body>
</html>
